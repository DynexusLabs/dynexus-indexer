name: Reset user data

# Biweekly reset for the Neon database used with the scheduled Index workflow.
# Removes user activity history; tokens, pools, gauges, epochs and live positions stay.
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:
    inputs:
      days:
        description: Keep history newer than this many days (0 = clear all)
        default: "0"

permissions:
  contents: read

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS: ${{ inputs.days || '0' }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          case "$DAYS" in ''|*[!0-9]*) echo "::error::days must be a number"; exit 1 ;; esac
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v days="$DAYS" -f scripts/reset-user-data.sql
