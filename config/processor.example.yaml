# Copy to config/processor.yaml (git-ignored) and fill in auth_token.
# Get a Transaction Stream API key at https://geomi.dev (Aptos Build).
health_check_port: 8085
server_config:
  transaction_stream_config:
    indexer_grpc_data_service_address: "https://grpc.testnet.aptoslabs.com:443"
    auth_token: "YOUR_TRANSACTION_STREAM_API_KEY"
    request_name_header: "dynexus-processor"
    # Version of the first DYNEXUS publish transaction; earlier history is skipped.
    starting_version: 0
    # Server-side filter: only transactions emitting events from the DYNEXUS address
    # are streamed, so the processor never downloads unrelated chain traffic.
    transaction_filter:
      type: EventFilter
      struct_type:
        address: "0x719ef75da8261aa8f9546d3c97e7d239e08b45a9bff80bbce2db65b05051a026"
  postgres_config:
    connection_string: "postgresql://dynexus:dynexus@localhost:5432/dynexus"
