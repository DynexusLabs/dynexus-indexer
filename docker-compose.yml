services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dynexus
      POSTGRES_PASSWORD: dynexus
      POSTGRES_DB: dynexus
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynexus"]
      interval: 2s
      retries: 30

  processor:
    build: .
    command: ["dynexus-processor", "--config-path", "/config/processor.yaml"]
    env_file: .env
    volumes: ["./config:/config:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: .
    command: ["dynexus-api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dynexus:dynexus@postgres:5432/dynexus
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
