[workspace]
resolver = "2"
members = ["crates/db", "crates/processor", "crates/api"]

[workspace.package]
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[workspace.dependencies]
dynexus-db = { path = "crates/db" }
anyhow = "1.0.86"
aptos-indexer-processor-sdk = { git = "https://github.com/aptos-labs/aptos-indexer-processor-sdk.git", tag = "aptos-indexer-processor-sdk-v2.4.1", features = ["postgres_full"] }
axum = "0.8"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "~2.3", features = ["postgres_backend", "serde_json", "numeric", "chrono"] }
diesel-async = { version = "0.7.4", features = ["postgres", "bb8"] }
diesel_migrations = { version = "2.1.0", features = ["postgres"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = { version = "1.0.81", features = ["preserve_order"] }
tokio = { version = "1.37.0", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1.34"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
